[project]
name = "macro-policy-rag-assistant"
version = "0.1.0"
description = "End-to-end multilingual RAG for Vietnamese macroeconomic and policy documents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "altair>=5.5.0,<6",
    "dlt[duckdb]>=1.11.0,<2",
    "duckdb>=1.2.2,<2",
    "langchain-text-splitters>=0.3.8,<1",
    "numpy>=1.26.4,<3",
    "openai>=1.76.0,<3",
    "pandas>=2.2.3,<3",
    "pypdf>=5.4.0,<7",
    "python-dotenv>=1.1.0,<2",
    "rank-bm25>=0.2.2,<1",
    "sentence-transformers>=4.1.0,<6",
    "streamlit>=1.44.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5,<9",
    "ruff>=0.11.7,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
